name: CI
on:
  push:
    branches:
      - main
  pull_request: null
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Prettier
        run: npm run format
      - name: Build
        run: npm run build
        
  tests:
    runs-on: ubuntu-latest
    needs: ci
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm ci
      - name: Run tests
        run: npm run test


